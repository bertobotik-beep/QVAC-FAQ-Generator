<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>QVAC FAQ Generator</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: linear-gradient(160deg, #fef3f2 0%, #fee2e2 100%);
    font-family: system-ui, -apple-system, sans-serif;
    color: #7f1d1d;
    display: flex;
    justify-content: center;
    padding: 46px 20px;
  }
  .wrap { width: 100%; max-width: 600px; }
  h1 { font-size: 1.5rem; margin: 0 0 6px; color: #b91c1c; font-weight: 800; text-align: center; }
  .subtitle { color: #9f5252; margin-bottom: 24px; font-size: 0.9rem; text-align: center; }
  .card {
    background: #ffffff;
    border: 2px solid #fecaca;
    border-radius: 16px;
    padding: 28px 26px;
  }
  textarea {
    width: 100%;
    padding: 12px 14px;
    border-radius: 12px;
    border: 2px solid #fecaca;
    background: #fffafa;
    color: #7f1d1d;
    font-family: inherit;
    font-size: 1rem;
    margin-bottom: 16px;
    resize: vertical;
    min-height: 90px;
  }
  button.action {
    padding: 12px 28px;
    border: none;
    border-radius: 999px;
    font-size: 1rem;
    font-weight: 700;
    font-family: inherit;
    cursor: pointer;
    background: #dc2626;
    color: #fff;
    width: 100%;
  }
  button.action:disabled { opacity: 0.4; cursor: not-allowed; }
  .status { margin-top: 14px; font-size: 0.85rem; color: #9f5252; min-height: 1.2em; text-align: center; }
  .faq-item { margin-top: 16px; }
  .faq-q { font-weight: 700; color: #b91c1c; margin-bottom: 4px; }
  .faq-a { color: #7f1d1d; line-height: 1.5; padding-left: 4px; }
  .footer-note { color: #9f5252; font-size: 0.78rem; margin-top: 20px; text-align: center; }
  .spinner {
    display: inline-block;
    width: 13px; height: 13px;
    border: 2px solid #fee2e2;
    border-top-color: #dc2626;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    vertical-align: middle;
    margin-right: 8px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
  <div class="wrap">
    <h1>QVAC FAQ Generator</h1>
    <p class="subtitle">Describe your product or service, get a grounded FAQ list. 100% on-device.</p>

    <div class="card">
      <textarea id="mainInput" placeholder="e.g. A subscription box that ships fresh coffee beans from a different roaster every month."></textarea>
      <button class="action" id="generateBtn">Generate FAQ</button>
      <div class="status" id="status"></div>
      <div id="resultBox"></div>
    </div>

    <p class="footer-note">Everything runs locally on your machine. No text ever leaves this device.</p>
  </div>

  <script>
    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    const mainInput = document.getElementById('mainInput');
    const generateBtn = document.getElementById('generateBtn');
    const status = document.getElementById('status');
    const resultBox = document.getElementById('resultBox');

    async function generate() {
      const value = mainInput.value.trim();
      if (!value) return;
      generateBtn.disabled = true;
      resultBox.innerHTML = '';
      status.innerHTML = '<span class="spinner"></span>Writing FAQ...';

      try {
        const res = await fetch('/api/faq', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ description: value }),
        });
        const data = await res.json();
        if (data.error) throw new Error(data.error);

        status.textContent = '';
        resultBox.innerHTML = data.faqs.map((f) => `
          <div class="faq-item">
            <div class="faq-q">Q: ${escapeHtml(f.q)}</div>
            <div class="faq-a">A: ${escapeHtml(f.a)}</div>
          </div>
        `).join('');
      } catch (err) {
        status.textContent = 'Error: ' + err.message;
      } finally {
        generateBtn.disabled = false;
      }
    }

    generateBtn.addEventListener('click', generate);
    mainInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) generate();
    });
  </script>
</body>
</html>
